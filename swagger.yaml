openapi: 3.0.3
info:
    title: TODO API
    version: 1.0.0
    description: >
        API de gestion d'une TODO List.

servers:
    - url: http://localhost:8080
      description: Serveur local de développement

tags:
    - name: tasks
      description: Opérations sur les tâches

paths:
    /tasks:
        get:
            tags: [tasks]
            summary: Récupérer toutes les tâches
            description: Retourne la liste des tâches. Le paramètre todo-only permet de récupérer seulement les tâches non terminées.
            operationId: getTasks
            parameters:
                - in: query
                  name: todo-only
                  required: false
                  description: Si true, retourne seulement les tâches à faire.
                  schema:
                      type: boolean
            responses:
                '200':
                    description: Liste des tâches récupérée avec succès
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Task'
                '204':
                    description: Aucune tâche trouvée

        post:
            tags: [tasks]
            summary: Créer une tâche
            description: Crée une nouvelle tâche à partir d'un JSON.
            operationId: createTask
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Task'
            responses:
                '201':
                    description: Tâche créée avec succès
                    headers:
                        Location:
                            description: URL de la ressource créée
                            schema:
                                type: string
                                example: /tasks/1
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Task'

    /tasks/{id}:
        parameters:
            - in: path
              name: id
              required: true
              description: Identifiant numérique de la tâche
              schema:
                  type: integer
                  minimum: 1

        get:
            tags: [tasks]
            summary: Récupérer une tâche
            description: Récupère une tâche par son identifiant.
            operationId: getTaskById
            responses:
                '200':
                    description: Tâche trouvée avec succès
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Task'
                '404':
                    description: Tâche non trouvée

        put:
            tags: [tasks]
            summary: Modifier une tâche
            description: Modifie une tâche existante à partir d'un JSON.
            operationId: updateTaskById
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Task'
            responses:
                '204':
                    description: Tâche modifiée avec succès
                '404':
                    description: Tâche non trouvée

        delete:
            tags: [tasks]
            summary: Supprimer une tâche
            description: Supprime une tâche par son identifiant.
            operationId: deleteTaskById
            responses:
                '204':
                    description: Tâche supprimée avec succès
                '404':
                    description: Tâche non trouvée

components:
    schemas:
        Task:
            type: object
            description: Représentation d'une tâche
            properties:
                id:
                    type: integer
                    example: 1
                title:
                    type: string
                    nullable: false
                    example: Acheter du lait
                description:
                    type: string
                    nullable: true
                    example: 2L demi-écrémé
                done:
                    type: boolean
                    nullable: false
                    example: false
            required:
                - id
                - title
                - done
